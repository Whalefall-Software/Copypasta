name: "[main] Build and Release"

on: 
  push:
    tags:
      - 'v*'
    branches: 
      - main

jobs:
    Build:
      name: Build ${{ matrix.platform.os-name }}
      runs-on: ${{ matrix.platform.runs-on }}
      strategy: 
          matrix:
            platform:
              - os-name: linux-x86_64
                runs-on: ubuntu-latest

              - os-name: windows-x86_64
                runs-on: windows-latest

              - os-name: macOS-x86_64
                runs-on: macOS-15-intel
                  
              - os-name: macOS-aarch64
                runs-on: macOS-latest

      steps:
        - name: Check Code
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:              
            python-version: '3.11' 
            cache: 'pip'
            cache-dependency-path: |
              **/requirements*.txt

        - name: install linux dependencies
          if: matrix.platform.runs-on == 'ubuntu-latest'
          run: |
              sudo apt-get update
              sudo apt-get install -y patchelf

        - name: install python dependencies
          run: | 
              python -m pip install --upgrade pip
              pip install -r requirements.txt

        - name: Nuitka Installation and Building
          uses: Nuitka/Nuitka-Action@main
          with:
            nuitka-version: main
            script-name: src/Main.py
            mode: app

        - name: Create Artifacts Directory
          run: |
            mkdir -p ./artifacts/
          
        - name: Prep Windows Artifact
          if: matrix.platform.runs-on == 'windows-latest'
          run: |
            copy build/*.exe .\artifacts\
        
        - name: Prep Unix Artifact
          if:  matrix.platform.runs-on != 'windows-latest'
          run: |
            cp build/*.bin ./artifacts/
            cp build/*.app ./artifacts/
          

        - name: Upload Build Artifacts
          uses: actions/upload-artifact@v4
          with: 
            name: ${{ matrix.platform.os-name }}-${{ matrix.platform.runs-on != 'windows-latest' && steps.get_version.outputs.new_tag || steps.get_version_win.outputs.new_tag }}
            path: ./artifacts/

    Release:
      name: Create Release with Auto-Version
      needs: Build
      runs-on: ubuntu-latest

      steps: 
        - name: Check Code
          uses: actions/checkout@v4
        
        - name: Download All Artifacts
          uses: actions/download-artifact@v4
          with:
              path: ./artifacts/
              pattern: "*"
              merge-multiple: true

        - name: Create GitHub Release
          uses: actions/create-release@latest
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            release_name: Main Build and Release
            tag_name: ${{ github.ref }}
            draft: false
            prerelease: false
          

        - name: Create GitHub Release
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            echo "Artifacts to be included in release:"
            find ./artifacts -type f -name "*" | while read file; do
              echo "- $(basename "$file")"
            done

            gh release create "${{ steps.get_tag.outputs.new_tag }}" \
              --title "Release ${{ steps.get_tag.outputs.new_tag }}" \
              --generate-notes \
              --latest \
              ./artifacts/*