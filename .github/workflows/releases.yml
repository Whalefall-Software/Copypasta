
on: 
    pull_request:
        branches: 
            - main
        types:
            - closed
jobs:
    build:
        strategy: 
            matrix:
                 os: [ubuntu-latest, macOS-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        steps:

        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
           python-version: '3.14.6' 
           cache: 'pip'
           cache-dependency-path: |
              **/requirements*.txt

        - name: install linux dependencies
          if: runner.os == 'Linux'
          run: |
           sudo apt-get update
           sudo apt-get install -y patchelf
      
        - run: python -m pip install --upgrade pip
        - run: pip install -r requirements.txt
        - uses: Nuitka/Nuitka-Action@main
          with:
            nuitka-version: main
            script-name: src/Main.py
            onefile: true
          
        - name: Check build file
          run: |
            find build/ -type f

        - name: Rename executables
          shell: bash
          run: | 
            if [ -f build/Main.bin ]; then
            mv build/Main.bin build/Copypasta-Linux64x.bin
              elif [ -f build/Main.app]; then
            mv build/Main.app build/Copypasta-macOS.app
              elif [-f build/Main.exe]; then
            mv build/Main.exe build/Copypasta-Windows64x.exe 
            fi

        - name: Upload artifact
          uses: actions/upload-artifact@v4
          continue-on-error: true
          with:
              name: executable-${{ matrix.os }} 
              path: |
                build/Copypasta-*

    release:
        permissions: 
            contents: write
        needs: build
        runs-on: ubuntu-latest
        steps:
        
        - name: Download Artifacts
          uses: actions/download-artifact@v4
          with: 
            path: all-releases

        - name: Create Github Release
          uses: softprops/action-gh-release@v2
          with:
            files: all-releases
            tag_name: ${{ github.ref_name }}
            body: "Automated release of ${{ github.ref_name }}"
          env: 
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
